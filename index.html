<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام بصمات الحضور والانصراف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Search Section */
        .search-box {
            background-color: #131e32;
            border: 1px solid #1e2d4a;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background-color: #0b1120;
            border: 1px solid #233554;
            color: #ffffff;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .search-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: #1d4ed8;
        }

        /* User Header Card */
        .user-card {
            background-color: #131e32;
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .user-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .user-title svg {
            width: 24px;
            height: 24px;
            fill: #38bdf8;
        }

        .user-info {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Attendance Table Card */
        .table-card {
            background-color: #131e32;
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background-color: #0f172a;
        }

        th {
            color: #38bdf8;
            padding: 14px 8px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #1e2d4a;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid #18263e;
            font-size: 14px;
            color: #e2e8f0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Indicator Dots */
        .time-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green { background-color: #22c55e; }
        .dot-red { background-color: #ef4444; }

        .no-data {
            padding: 25px;
            color: #ef4444;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- البحث -->
    <div class="search-box">
        <input type="text" id="empId" class="search-input" value="7671" placeholder="أدخل الكود الوظيفي">
        <button class="search-btn" onclick="loadData()">عرض بياناتي</button>
    </div>

    <!-- كارت اسم الموظف -->
    <div class="user-card">
        <div class="user-title">
            <span id="nameText">ياسر حمدان محمد حسن</span>
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="user-info" id="infoText">
            الكود: 7671 | القسم: 19 ديارنا | الوظيفة: محاسب موقع
        </div>
    </div>

    <!-- جدول البصمات -->
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>اليوم / التاريخ</th>
                    <th>أول دخول</th>
                    <th>آخر خروج</th>
                </tr>
            </thead>
            <tbody id="logsTable">
            </tbody>
        </table>
    </div>
</div>

<script>
    const daysName = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    // دالة ديناميكية لحساب اسم اليوم من التاريخ الحقيقي 100%
    function getCorrectDayName(dateString) {
        const d = new Date(dateString + "T00:00:00");
        return daysName[d.getDay()];
    }

    // دالة لتحميل البيانات وقراءة الملفات أو الـ JSON
    async function fetchAllEmployeesData() {
        try {
            // يمكن تحميل ملف json الخارجي أو الفولدر
            const response = await fetch('attendance_data.json');
            if (response.ok) {
                return await response.json();
            }
        } catch (e) {
            console.log("جارٍ التحميل المحلي...");
        }
        return null;
    }

    let globalData = null;

    async function loadData() {
        const id = document.getElementById("empId").value.trim();
        const tbody = document.getElementById("logsTable");

        if (!globalData) {
            globalData = await fetchAllEmployeesData();
        }

        // إذا وُجد بيانات الموظف
        if (globalData && globalData[id]) {
            const emp = globalData[id];
            document.getElementById("nameText").innerText = emp.name;
            document.getElementById("infoText").innerText = emp.info;

            tbody.innerHTML = "";

            emp.logs.forEach(item => {
                const dayName = getCorrectDayName(item.date);
                const parts = item.date.split("-");
                const formattedDate = `${dayName} (${parts[2]}/${parts[1]}/${parts[0]})`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>
                        <div class="time-cell">
                            <span>${item.in}</span>
                            <span class="dot dot-green"></span>
                        </div>
                    </td>
                    <td>
                        <div class="time-cell">
                            <span>${item.out}</span>
                            <span class="dot dot-red"></span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            // معالجة البحث إذا الموظف غير موجود أو عند فتح الصفحة لأول مرة
            renderFallbackOrError(id);
        }
    }

    function renderFallbackOrError(id) {
        const tbody = document.getElementById("logsTable");
        if (id === "7671" || id === "") {
            // عرض الافتراضي لياسر حمدان لكل الأيام
            document.getElementById("nameText").innerText = "ياسر حمدان محمد حسن";
            document.getElementById("infoText").innerText = "الكود: 7671 | القسم: 19 ديارنا | الوظيفة: محاسب موقع";
            
            const defaultLogs = [
                { date: "2026-06-28", in: "08:44", out: "17:53" },
                { date: "2026-06-29", in: "08:06", out: "17:29" },
                { date: "2026-06-30", in: "08:06", out: "17:49" },
                { date: "2026-07-01", in: "08:06", out: "21:10" },
                { date: "2026-07-04", in: "10:25", out: "10:25" },
                { date: "2026-07-05", in: "08:38", out: "17:23" },
                { date: "2026-07-06", in: "08:22", out: "17:40" },
                { date: "2026-07-07", in: "08:23", out: "17:27" },
                { date: "2026-07-08", in: "08:10", out: "17:31" },
                { date: "2026-07-09", in: "08:22", out: "13:58" },
                { date: "2026-07-11", in: "11:38", out: "17:24" },
                { date: "2026-07-12", in: "08:08", out: "18:12" },
                { date: "2026-07-13", in: "08:06", out: "17:39" },
                { date: "2026-07-14", in: "08:07", out: "17:21" },
                { date: "2026-07-15", in: "08:14", out: "21:07" },
                { date: "2026-07-16", in: "08:09", out: "13:59" },
                { date: "2026-07-18", in: "10:19", out: "17:40" },
                { date: "2026-07-19", in: "08:04", out: "17:30" },
                { date: "2026-07-20", in: "08:07", out: "17:01" },
                { date: "2026-07-21", in: "08:08", out: "17:17" },
                { date: "2026-07-22", in: "08:12", out: "20:43" },
                { date: "2026-07-23", in: "08:11", out: "13:47" },
                { date: "2026-07-25", in: "09:51", out: "19:54" }
            ];

            tbody.innerHTML = "";
            defaultLogs.forEach(item => {
                const dayName = getCorrectDayName(item.date);
                const parts = item.date.split("-");
                const formattedDate = `${dayName} (${parts[2]}/${parts[1]}/${parts[0]})`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>
                        <div class="time-cell">
                            <span>${item.in}</span>
                            <span class="dot dot-green"></span>
                        </div>
                    </td>
                    <td>
                        <div class="time-cell">
                            <span>${item.out}</span>
                            <span class="dot dot-red"></span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="3" class="no-data">عفواً، لا تتوفر بيانات حضور لكود الموظف (${id})</td></tr>`;
        }
    }

    // إتاحة البحث بالضغط على Enter
    document.getElementById("empId").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            loadData();
        }
    });

    window.onload = loadData;
</script>

</body>
</html>
