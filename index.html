<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام بصمات الحضور والانصراف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Search Box */
        .search-card {
            background-color: #172a46;
            border: 1px solid #233b5d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background-color: #0b1329;
            border: 1px solid #2a4365;
            color: #ffffff;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .search-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: #1d4ed8;
        }

        /* Profile Card */
        .profile-card {
            background-color: #172a46;
            border: 1px solid #233b5d;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            fill: #38bdf8;
        }

        .profile-details {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Table Area */
        .table-container {
            background-color: #172a46;
            border: 1px solid #233b5d;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #0f1c32;
            color: #38bdf8;
            padding: 12px 6px;
            font-weight: 600;
            border-bottom: 1px solid #233b5d;
        }

        td {
            padding: 12px 6px;
            border-bottom: 1px solid #1e3a5f;
            color: #e2e8f0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Status Badges */
        .badge-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .dot-green { background-color: #22c55e; }
        .dot-red { background-color: #ef4444; }

        .time-text {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- البحث -->
    <div class="search-card">
        <input type="text" id="empIdInput" class="search-input" value="7671" placeholder="أدخل الكود الوظيفي">
        <button class="search-btn" onclick="fetchData()">عرض بياناتي</button>
    </div>

    <!-- كارت بيانات الموظف -->
    <div class="profile-card" id="profileCard">
        <div class="profile-header">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <div class="profile-name" id="empName">ياسر حمدان محمد حسن</div>
        </div>
        <div class="profile-details" id="empDetails">
            الكود: 7671 | القسم: 19 ديارنا | الوظيفة: محاسب موقع
        </div>
    </div>

    <!-- جدول البصمات -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اليوم / التاريخ</th>
                    <th>أول دخول</th>
                    <th>آخر خروج</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody">
                <!-- سيتم ملء البيانات ديناميكياً بواسطة JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // قاعدة بيانات تجريبية (مربوطة بسجل البصمات الصحيح)
    const rawAttendanceData = {
        "7671": {
            name: "ياسر حمدان محمد حسن",
            code: "7671",
            dept: "19 ديارنا",
            job: "محاسب موقع",
            logs: [
                { date: "2026-07-15", in: "08:14", out: "21:07" },
                { date: "2026-07-16", in: "08:09", out: "13:59" },
                { date: "2026-07-18", in: "10:19", out: "17:40" },
                { date: "2026-07-19", in: "08:04", out: "17:30" },
                { date: "2026-07-20", in: "08:07", out: "17:01" },
                { date: "2026-07-21", in: "08:08", out: "17:17" },
                { date: "2026-07-22", in: "08:12", out: "20:43" },
                { date: "2026-07-23", in: "08:11", out: "13:47" },
                { date: "2026-07-25", in: "09:51", out: "19:54" }
            ]
        }
    };

    // مصفوفة أسماء الأيام بالعربية مع ضبط بداية الأسبوع
    const daysArabic = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    // دالة لحساب اسم اليوم الحقيقي من التاريخ بصيغة YYYY-MM-DD
    function getArabicDayName(dateString) {
        // إضافة T00:00:00 لمنع الفروق الزمنية بين التوقيتات المحلية
        const dateObj = new Date(dateString + "T00:00:00");
        return daysArabic[dateObj.getDay()];
    }

    // دالة لتنسيق التاريخ ليظهر بالشكل (DD/MM/YYYY)
    function formatDate(dateString) {
        const parts = dateString.split("-");
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function fetchData() {
        const empCode = document.getElementById("empIdInput").value.trim();
        const emp = rawAttendanceData[empCode];
        const tbody = document.getElementById("attendanceTableBody");

        if (!emp) {
            alert("لم يتم العثور على بيانات للكود المدخل!");
            return;
        }

        // تحديث كارت الموظف
        document.getElementById("empName").innerText = emp.name;
        document.getElementById("empDetails").innerText = `الكود: ${emp.code} | القسم: ${emp.dept} | الوظيفة: ${emp.job}`;

        // تفريغ الجدول وإعادة بنائه
        tbody.innerHTML = "";

        emp.logs.forEach(log => {
            const dayName = getArabicDayName(log.date);
            const formattedDateStr = formatDate(log.date);

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${dayName} (${formattedDateStr})</td>
                <td>
                    <span class="time-text">${log.in}</span>
                    <span class="badge-dot dot-green"></span>
                </td>
                <td>
                    <span class="time-text">${log.out}</span>
                    <span class="badge-dot dot-red"></span>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // تشغيل العرض التلقائي عند فتح الصفحة
    window.onload = function() {
        fetchData();
    };
</script>

</body>
</html>
